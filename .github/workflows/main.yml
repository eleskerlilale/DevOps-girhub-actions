name: DevOps Proyekti CI/CD

# 1. Pipeline nə vaxt işə düşsün?
on:
  push:
    branches: [ "main" ]  # main budağına kod push olunanda
  pull_request:
    branches: [ "main" ]  # Pull request açılanda

jobs:
  # 2. BİLD VƏ TEST MƏRHƏLƏSİ
  build-and-test:
    runs-on: ubuntu-latest # GitHub-ın bizə verdiyi virtual kompyuter
    
    steps:
      - name: Kodu kopyala
        uses: actions/checkout@v3 # Repositoriyadakı kodu virtual maşına çəkir

      - name: Python mühitini quraşdır
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kitabxanaları yüklə
        run: |
          pip install --upgrade pip
          # Əgər requirements.txt varsa: pip install -r requirements.txt

      - name: Testləri icra et
        run: |
          echo "Testlər başladılır..."
          # Bura real test əmrini (məs: pytest) yaza bilərsən
          echo "Bütün testlər uğurla keçdi (OK)."

  # 3. DEPLOY (YERLƏŞDİRMƏ) MƏRHƏLƏSİ
  deploy:
    needs: build-and-test # Bu mərhələ yalnız Build uğurlu olsa işləyəcək
    runs-on: ubuntu-latest
    
    steps:
      - name: Serverə qoşulma və Yerləşdirmə
        run: |
          echo "Serverə qoşulur..."
          echo "Yeni versiya tətbiq olunur..."
          echo "Layihə canlı mühitdədir: http://mysite.com"